data:
  tensor_gsd_m_per_px: 0.1
sampling:
  reference_crop_size_px:
  - 384
  - 384
prompt:
  representation: ellipse_or_gaussian_point
  point_sigma_m: 4.75
  ellipse_edge_m: 0.1
  target_sigma_m: 0.35
  backend: sam2
  sam2:
    checkpoint_sha256: 6d1aa6f30de5c92224f8172114de081d104bbd23dd9dc5c58996f0cad5dc4d38
    device: auto
    model_config: configs/sam2.1/sam2.1_hiera_s.yaml
    crop_sizes_m:
    - 12.0
    - 24.0
    - 38.4
    minimum_score: 0.5
    minimum_area_m2: 0.04
    maximum_area_m2: 200.0
    maximum_crop_fraction: 0.65
    edge_softness_m: 0.1
    fallback: gaussian
model:
  backbone: convnext_tiny
  pretrained: false
  matcher: masked_xcorr_v6
  match_channels: 32
  input_representation: rgb_invariant_v1
training:
  precision: auto
  image_augmentation:
    train:
      enabled: true
      photometric_probability: 0.8
      brightness_range:
      - 0.85
      - 1.15
      contrast_range:
      - 0.85
      - 1.15
      saturation_range:
      - 0.85
      - 1.15
      hue_range:
      - -0.03
      - 0.03
      gamma_range:
      - 0.85
      - 1.15
      rotation_degrees:
      - 0
      - 90
      - 180
      - 270
      horizontal_flip_probability: 0.5
      vertical_flip_probability: 0.5
      gaussian_blur_probability: 0.3
      gaussian_blur_sigma_px:
      - 0.1
      - 1.2
      gaussian_noise_probability: 0.3
      gaussian_noise_std:
      - 0.0
      - 0.015
      composite_shadow_probability: 0.3
      shadow_transmission_range:
      - 0.08
      - 0.5
      shadow_ambient_range:
      - 0.001
      - 0.015
      shadow_red_gain_range:
      - 0.68
      - 0.94
      shadow_green_gain_range:
      - 0.82
      - 1.02
      shadow_blue_gain_range:
      - 0.98
      - 1.22
      shadow_field_strength_range:
      - 0.0
      - 0.18
      shadow_field_grid_size: 8
      cast_shadow_probability: 0.5
      cast_shadow_coverage_range:
      - 0.2
      - 0.85
      cast_shadow_edge_softness_px:
      - 5.0
      - 55.0
    validation:
      enabled: false
  masking:
    train:
      augmentation:
        enabled: false
        center_jitter_m: 0.15
        scale_range:
        - 0.8
        - 1.25
        orientation_jitter_deg: 15.0
        morphology_radius_px:
        - -2
        - 2
        blur_sigma_px:
        - 0.0
        - 1.25
inference:
  stitch_stride_px: 4
  match_logit_weight: 0.0
  search:
    mode: radius
    radius_m: 160.0
    tile_size_px:
    - 512
    - 512
    tile_overlap: 0.5
    tile_batch_size: 8
  early_stop:
    confidence_threshold: 0.8
    stability_expansions: 1
    stability_tolerance_m: 1.0
    minimum_peak_margin: 0.1
  decision_threshold: 0.5
evaluation:
  distance_unit: m
  success_thresholds_m:
  - 0.5
  - 1.0
  - 2.0
  - 5.0
  - 10.0
  confidence_success_threshold_m: 2.0
  aggregate_by: spatial_group
  search_modes:
  - radius
search_training:
  epochs: 8
  learning_rate: 1.0e-05
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  precision: auto
  radius_m: 160.0
  tile_size_px:
  - 512
  - 512
  tile_overlap: 0.5
  encoder_batch_size: 8
  stitch_stride_px: 4
  match_logit_weight: 0.0
  target_sigma_m: 0.35
  train_query_limit: null
  validation_query_limit: null
  loss:
    global_weight: 0.5
    presence_weight: 0.1
    positive_localization_weight: 0.1
    negative_suppression_weight: 0.05
    ranking_weight: 1.0
    ranking_margin: 1.0
    negative_temperature: 0.1
    ranking_exclusion_radius_m: 2.0
  trainable_modules:
  - input_adapter
  - search_projection
  - relation_encoder
  - location_head
  - match_head

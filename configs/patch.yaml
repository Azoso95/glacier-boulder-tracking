data:
  tensor_gsd_m_per_px: 0.1
  simulated_effective_gsd_m_per_px:
  - 0.1
  - 0.2
  - 0.3
  downsample_mode: area
  upsample_mode: bilinear
  image_dtype: uint8
  image_layout: CHW
sampling:
  spatial_group_column: spatial_group
  keep_tracks_atomic: true
  reject_cross_split_window_overlap: true
  reference_placement: uniform_safe
  search_placement: controlled_composition
  reference_crop_size_px:
  - 384
  - 384
  search_crop_size_px:
  - 512
  - 512
  reference_margin_px: 16
  search_center_jitter_m:
  - 15.0
  - 15.0
  samples_per_track_pair: 8
  sample_composition:
    positive: 4
    target_outside_window: 8
    distractor: 8
    target_unobservable: 4
  negative_exclusion_margin_m: 2.0
  distractor_same_spatial_group: true
  sampling_attempts: 64
  positive_target_margin_px: 16
  minimum_valid_fraction: 0.95
  require_spatial_group: true
  include_no_match: true
  negative_types:
  - target_outside_window
  - target_unobservable
  - distractor
prompt:
  representation: ellipse_or_gaussian_point
  point_sigma_m: 4.75
  ellipse_edge_m: 0.1
  target_sigma_m: 0.35
  backend: sam2
  sam2:
    checkpoint_sha256: 6d1aa6f30de5c92224f8172114de081d104bbd23dd9dc5c58996f0cad5dc4d38
    device: auto
    model_config: configs/sam2.1/sam2.1_hiera_s.yaml
    crop_sizes_m:
    - 12.0
    - 24.0
    - 38.4
    minimum_score: 0.5
    minimum_area_m2: 0.04
    maximum_area_m2: 200.0
    maximum_crop_fraction: 0.65
    edge_softness_m: 0.1
    fallback: gaussian
model:
  backbone: convnext_tiny
  pretrained: true
  matcher: masked_xcorr_v6
  match_channels: 32
  outputs:
  - match_logit
  - location_heatmap
  input_representation: rgb_invariant_v1
training:
  allow_shared_cache: false
  device: auto
  precision: auto
  freeze_feature_extractor: false
  epochs: 4
  batch_size: 16
  validation_batch_size: 16
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.0001
  match_positive_weight: auto
  localization_weight: 0.15
  positive_localization_weight: 0.25
  positive_localization_margin: 1.0
  positive_peak_ranking_weight: 0.2
  positive_peak_ranking_margin: 1.0
  negative_localization_weight: 0.25
  negative_localization_margin: 0.0
  negative_localization_temperature: 0.1
  retrieval_ranking_weight: 0.0
  retrieval_ranking_margin: 1.0
  retrieval_ranking_temperature: 0.1
  retrieval_match_logit_weight: 1.0
  gradient_clip_norm: 1.0
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    threshold: 0.001
    cooldown: 0
    minimum_lr: 1.0e-07
  early_stopping:
    enabled: false
    patience: 5
    minimum_delta: 0.001
    minimum_epochs: 8
  checkpoint_selection:
    minimum_match_recall: 0.0
    minimum_match_specificity: 0.0
    minimum_match_auroc: 0.6
    minimum_best_balanced_accuracy: 0.6
    minimum_localization_success_at_2m: 0.5
    minimum_retrieval_top1_accuracy: 0.0
    match_auroc_weight: 0.5
    localization_success_weight: 0.5
    retrieval_top1_weight: 0.0
  image_augmentation:
    train:
      enabled: true
      photometric_probability: 0.8
      brightness_range:
      - 0.85
      - 1.15
      contrast_range:
      - 0.85
      - 1.15
      saturation_range:
      - 0.85
      - 1.15
      hue_range:
      - -0.03
      - 0.03
      gamma_range:
      - 0.85
      - 1.15
      rotation_degrees:
      - 0
      - 90
      - 180
      - 270
      horizontal_flip_probability: 0.5
      vertical_flip_probability: 0.5
      gaussian_blur_probability: 0.3
      gaussian_blur_sigma_px:
      - 0.1
      - 1.2
      gaussian_noise_probability: 0.3
      gaussian_noise_std:
      - 0.0
      - 0.015
      composite_shadow_probability: 0.3
      shadow_transmission_range:
      - 0.08
      - 0.5
      shadow_ambient_range:
      - 0.001
      - 0.015
      shadow_red_gain_range:
      - 0.68
      - 0.94
      shadow_green_gain_range:
      - 0.82
      - 1.02
      shadow_blue_gain_range:
      - 0.98
      - 1.22
      shadow_field_strength_range:
      - 0.0
      - 0.18
      shadow_field_grid_size: 8
      cast_shadow_probability: 0.5
      cast_shadow_coverage_range:
      - 0.2
      - 0.85
      cast_shadow_edge_softness_px:
      - 5.0
      - 55.0
    validation:
      enabled: false
  masking:
    train:
      approaches:
        ellipse: 0.75
        gaussian_point: 0.25
        auto: 1.0
      resample_each_epoch: true
      augmentation:
        enabled: true
        center_jitter_m: 0.15
        scale_range:
        - 0.8
        - 1.25
        orientation_jitter_deg: 15.0
        morphology_radius_px:
        - -2
        - 2
        blur_sigma_px:
        - 0.0
        - 1.25
    validation:
      approaches:
        ellipse: 0.75
        gaussian_point: 0.25
        auto: 1.0
      resample_each_epoch: false
      augmentation:
        enabled: false
        center_jitter_m: 0.15
        scale_range:
        - 0.8
        - 1.25
        orientation_jitter_deg: 15.0
        morphology_radius_px:
        - -2
        - 2
        blur_sigma_px:
        - 0.0
        - 1.25
inference:
  maximum_cached_tiles: 512
  match_logit_weight: 1.0
  search:
    mode: radius
    radius_m: 75.0
    maximum_radius_m: null
    ring_step_m: 100.0
    tile_size_px:
    - 512
    - 512
    tile_overlap: 0.5
    tile_batch_size: 16
  early_stop:
    confidence_threshold: 0.8
    stability_expansions: 1
    stability_tolerance_m: 1.0
    minimum_peak_margin: 0.1
  decision_threshold: 0.5
evaluation:
  distance_unit: m
  success_thresholds_m:
  - 0.5
  - 1.0
  - 2.0
  - 5.0
  - 10.0
  confidence_success_threshold_m: 2.0
  aggregate_by: spatial_group
  search_modes:
  - radius
